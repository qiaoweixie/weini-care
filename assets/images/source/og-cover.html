<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>og-cover 1200×630</title>
<!--
  社群分享圖的原始頁。要重新產生 PNG 時，在專案根目錄執行：
  chrome --headless --hide-scrollbars --window-size=1200,630 --virtual-time-budget=6000
         --screenshot=assets/images/og-cover.png assets/images/source/og-cover.html
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #F3E2DD;
    color: #5E554D;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }
  .ring { position: absolute; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.7); }
  .ring.a { width: 520px; height: 520px; right: -120px; top: -160px; }
  .ring.b { width: 260px; height: 260px; right: 260px; bottom: -110px; }
  .blob {
    position: absolute; right: -40px; bottom: -80px; width: 460px; height: 460px;
    border-radius: 44% 56% 43% 57% / 38% 42% 58% 62%;
    background: linear-gradient(135deg, #EBCFC7, #F7F1EC);
    opacity: .9;
  }
  .copy { position: absolute; left: 88px; top: 96px; width: 700px; }
  .kicker { font-size: 18px; letter-spacing: .22em; color: #8F6944; margin: 0 0 22px; }
  h1 { margin: 0 0 24px; font-size: 84px; line-height: 1.12; font-weight: 400; color: #A77C52; }
  .lead { margin: 0 0 34px; font-size: 27px; line-height: 1.5; color: #766A61; }
  .chips { display: flex; gap: 12px; }
  .chip {
    padding: 10px 18px; border-radius: 999px; font-size: 20px; color: #766A61;
    background: rgba(255,255,255,.78); border: 1px solid rgba(255,255,255,.95);
  }
  .mark {
    position: absolute; right: 96px; top: 118px; width: 300px; height: 300px;
    border-radius: 50%; background: #E8B7A7; display: grid; place-items: center;
    box-shadow: 0 24px 60px rgba(117,92,73,.16);
  }
  .mark img { width: 300px; height: 300px; }
  .brand { position: absolute; left: 88px; bottom: 56px; display: flex; align-items: center; gap: 18px; }
  .brand strong { font-size: 30px; font-weight: 400; color: #A77C52; }
  .brand span { font-size: 18px; letter-spacing: .14em; color: #8F6944; }
  .handle { position: absolute; right: 96px; bottom: 60px; font-size: 22px; color: #8F6944; letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="ring a"></div>
  <div class="ring b"></div>
  <div class="blob"></div>

  <div class="mark"><img src="../logo-white.svg" alt=""></div>

  <div class="copy">
    <p class="kicker">RECHARGE LOUNGE · SLEEP EXPERIENCE</p>
    <h1>50 分鐘，<br>讓自己重新開機。</h1>
    <p class="lead">給忙碌的人，一段什麼都不用做、<br>只需要好好休息的時間。</p>
    <div class="chips">
      <span class="chip">50 分鐘睡眠體驗</span>
      <span class="chip">台北・桃園</span>
      <span class="chip">採預約制</span>
    </div>
  </div>

  <div class="brand">
    <strong>午睡空間</strong>
    <span>RECHARGE LOUNGE</span>
  </div>
  <div class="handle">Instagram @weini.care</div>
</body>
</html>
